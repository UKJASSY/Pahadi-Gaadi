<!DOCTYPE html>
<html>
<head>
<title>PahadiGaadi Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0f172a;
  color: white;
}

header {
  padding: 15px;
  background: #020617;
  text-align: center;
  font-size: 20px;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  color: black;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
}

.btn {
  padding: 10px;
  border: none;
  border-radius: 6px;
  margin-top: 8px;
  cursor: pointer;
}

.accept {
  background: green;
  color: white;
}

.reject {
  background: red;
  color: white;
}
</style>
</head>

<body>

<header>🚖 PahadiGaadi Admin Panel</header>

<div class="container" id="rides"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
  storageBucket: "pahadigaadi.firebasestorage.app",
  messagingSenderId: "465488936633",
  appId: "1:465488936633:web:7e5f46325366bf0bf66568"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ridesDiv = document.getElementById("rides");

onSnapshot(collection(db, "rides"), (snapshot) => {
  ridesDiv.innerHTML = "";

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <b>${data.name}</b><br>
      📞 ${data.phone}<br><br>

      📍 ${data.pickup}<br>
      🏁 ${data.drop}<br>
      🚗 ${data.vehicle}<br><br>

      Status: <b>${data.status || "Pending"}</b><br>

      <button class="btn accept">Accept</button>
      <button class="btn reject">Reject</button>
    `;

    const acceptBtn = card.querySelector(".accept");
    const rejectBtn = card.querySelector(".reject");

    acceptBtn.onclick = async () => {
      await updateDoc(doc(db, "rides", docSnap.id), {
        status: "Accepted"
      });

      let msg = `🚕 Ride Accepted

Name: ${data.name}
Phone: ${data.phone}

Pickup: ${data.pickup}
Drop: ${data.drop}
Vehicle: ${data.vehicle}`;

      window.open("https://wa.me/91" + data.phone + "?text=" + encodeURIComponent(msg));
    };

    rejectBtn.onclick = async () => {
      await updateDoc(doc(db, "rides", docSnap.id), {
        status: "Rejected"
      });

      alert("Ride Rejected ❌");
    };

    ridesDiv.appendChild(card);
  });
});
</script>

</body>
</html>
