<title>PahadiGaadi</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at top left,#1e3a8a33,transparent 30%),
  radial-gradient(circle at bottom right,#06b6d433,transparent 30%),
  linear-gradient(135deg,#020617,#0f172a,#111827);
  color:white;
  overflow-x:hidden;
  position:relative;
}

/* animated glow background */
body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:#06b6d4;
  filter:blur(180px);
  opacity:0.15;
  top:-150px;
  left:-150px;
  animation:floatGlow 8s ease-in-out infinite alternate;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  width:450px;
  height:450px;
  background:#3b82f6;
  filter:blur(180px);
  opacity:0.12;
  bottom:-150px;
  right:-150px;
  animation:floatGlow2 10s ease-in-out infinite alternate;
  z-index:-2;
}

@keyframes floatGlow{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(60px,40px);
  }
}

@keyframes floatGlow2{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(-50px,-30px);
  }
}

/* header */
header{
  text-align:center;
  padding:22px 15px;
  position:relative;
}

/* logo title */
.slide-left,
.slide-right{
  font-size:34px;
  font-weight:800;
  letter-spacing:1px;
  color:#e2e8f0;
  text-shadow:
  0 0 10px rgba(255,255,255,0.2),
  0 0 20px rgba(6,182,212,0.4);
}

/* animations */
.slide-left{
  transform:translateX(-100px);
  opacity:0;
  animation:slideLeft 0.8s ease forwards;
}

.slide-right{
  transform:translateX(100px);
  opacity:0;
  animation:slideRight 0.8s ease forwards;
}

@keyframes slideLeft{
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes slideRight{
  to{
    transform:translateX(0);
    opacity:1;
  }
}

/* logo */
.logo-zoom{
  width:58px;
  height:58px;
  border-radius:16px;
  background:white;
  padding:5px;
  box-shadow:
  0 0 20px rgba(6,182,212,0.5),
  0 0 40px rgba(59,130,246,0.3);
  transform:scale(0);
  animation:zoomIn 0.6s ease forwards;
  animation-delay:0.3s;
}

@keyframes zoomIn{
  to{
    transform:scale(1);
  }
}

/* hero */
.hero{
  text-align:center;
  padding:10px 20px 0;
}

.hero h2{
  font-size:22px;
  font-weight:600;
  color:#cbd5e1;
  text-shadow:0 0 10px rgba(255,255,255,0.15);
}

/* glass container */
.container{
  margin:20px;
  padding:22px;
  border-radius:28px;
  background:rgba(15,23,42,0.65);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
  0 8px 32px rgba(0,0,0,0.45),
  inset 0 0 1px rgba(255,255,255,0.1);
}

/* input section */
.input-box{
  position:relative;
  margin-bottom:16px;
}

.input-box input{
  width:100%;
  padding:15px 45px 15px 16px;
  border:none;
  outline:none;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  color:white;
  font-size:14px;
  transition:0.3s;
  border:1px solid rgba(255,255,255,0.05);
}

.input-box input::placeholder{
  color:#94a3b8;
}

.input-box input:focus{
  border:1px solid #06b6d4;
  box-shadow:
  0 0 10px rgba(6,182,212,0.4),
  0 0 20px rgba(6,182,212,0.2);
}

/* location button */
.loc-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,#06b6d4,#2563eb);
  color:white;
  cursor:pointer;
  box-shadow:0 0 15px rgba(6,182,212,0.5);
}

/* vehicle section */
.vehicle-box{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.vehicle{
  flex:1;
  padding:16px 10px;
  border-radius:18px;
  text-align:center;
  cursor:pointer;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.06);
  transition:0.3s ease;
  font-weight:500;
  color:#cbd5e1;
}

.vehicle:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(6,182,212,0.15);
}

.vehicle.active{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  border:none;
  box-shadow:
  0 0 18px rgba(34,197,94,0.7),
  0 0 35px rgba(34,197,94,0.45),
  0 0 55px rgba(34,197,94,0.25);
  transform:scale(1.04);
}
/* main button */
.book-btn{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:18px;
  font-size:16px;
  font-weight:600;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#06b6d4,#2563eb);
  transition:0.3s;
  box-shadow:
  0 0 20px rgba(6,182,212,0.4),
  0 0 40px rgba(37,99,235,0.2);
}

.book-btn:hover{
  transform:translateY(-2px) scale(1.01);
}

.book-btn:active{
  transform:scale(0.98);
}

/* logout button */
header button{
  background:rgba(220,38,38,0.85)!important;
  border:none;
  color:white;
  padding:8px 14px!important;
  border-radius:20px!important;
  backdrop-filter:blur(10px);
  box-shadow:0 0 12px rgba(239,68,68,0.4);
}

/* map */
#map{
  height:320px;
  margin:20px;
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
  0 10px 30px rgba(0,0,0,0.45),
  0 0 20px rgba(6,182,212,0.08);
}

/* bottom sheet */
.bottom-sheet{
  margin:20px;
  padding:20px;
  border-radius:28px;
  background:rgba(15,23,42,0.65);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:
  0 8px 30px rgba(0,0,0,0.4);
  color:#e2e8f0;
  font-size:15px;
  line-height:1.8;
}

/* price */
.price{
  color:#22c55e;
  font-size:20px;
  font-weight:700;
  text-shadow:0 0 10px rgba(34,197,94,0.4);
}

/* status */
#statusBox{
  display:inline-block;
  margin-top:12px;
  padding:12px 18px;
  border-radius:18px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.06);
  color:#cbd5e1;
}

/* rating popup */
#ratingPopup{
  background:rgba(15,23,42,0.95)!important;
  color:white!important;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
  0 0 30px rgba(6,182,212,0.25);
}

#stars span{
  cursor:pointer;
  transition:0.2s;
}

#stars span:hover{
  transform:scale(1.2);
}

/* mobile */
@media(max-width:600px){

  .slide-left,
  .slide-right{
    font-size:28px;
  }

  .vehicle{
    font-size:13px;
    padding:14px 8px;
  }

  .container,
  .bottom-sheet,
  #map{
    margin:14px;
  }

}
  .glow-line {
  filter: drop-shadow(0 0 8px #22c55e)
          drop-shadow(0 0 15px #22c55e);
}
</style>
</head>

});
  driverDirectionsRenderer.setMap(map);

  const pickupAuto = new google.maps.places.Autocomplete(document.getElementById("pickup"));
  const dropAuto = new google.maps.places.Autocomplete(document.getElementById("drop"));

  pickupAuto.addListener("place_changed", showRoute);
  dropAuto.addListener("place_changed", showRoute);

  setTimeout(() => {
  listenDriverLocation();
}, 1500);
}

function listenDriverLocation() {
  const ref = window.doc(window.db, "drivers", "driver1");

  window.onSnapshot(ref, (docSnap) => {
    if (!docSnap.exists()) return;

    const data = docSnap.data();
    const driverPos = {
      lat: data.lat,
      lng: data.lng
    };

    if (!driverMarker) {
      driverMarker = new google.maps.Marker({
        position: driverPos,
        map: map,
        icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
      });
    } else {
      driverMarker.setPosition(driverPos);
    }
  });
}

function selectVehicle(el, v) {
  document.querySelectorAll('.vehicle').forEach(x => x.classList.remove('active'));

  selectedVehicle = v;
  showRoute();
}
