<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to right, #0f172a, #1e293b);
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo img {
  width: 55px;
  height: 55px;
  border-radius: 10px;
  background: white;
  padding: 4px;
}

.hero { text-align: center; padding: 10px; }

.container {
  background: white;
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}

.input-box {
  position: relative;
  margin-bottom: 12px;
}

.input-box input {
  width: 100%;
  padding: 14px 40px 14px 14px;
  border-radius: 25px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.loc-btn {
  display: block;
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: #0f172a;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
}

.vehicle-box {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.vehicle {
  flex: 1;
  padding: 12px;
  text-align: center;
  border-radius: 12px;
  border: 2px solid #ddd;
  cursor: pointer;
}

.vehicle.active {
  background: #0f172a;
  color: white;
}

.book-btn {
  width: 100%;
  padding: 14px;
  background: green;
  color: white;
  border: none;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 16px;
}

#map {
  height: 300px;
  margin: 20px;
  border-radius: 15px;
}

.bottom-sheet {
  background: white;
  color: black;
  padding: 15px;
}

.price {
  font-weight: bold;
  color: green;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" style="padding:30px; text-align:center;">
  <h2>PahadiGaadi Login</h2>

  <div class="input-box">
    <input type="text" id="loginName" placeholder="👤 Your Name">
  </div>

  <div class="input-box">
    <input type="tel" id="loginPhone" placeholder="📞 Phone Number">
  </div>

  <button class="book-btn" onclick="loginUser()">Continue</button>
</div>

<!-- MAIN -->
<div id="rideScreen" style="display:none;">

<header>
  <div class="logo">
    <img src="logo.png">
    <span>PahadiGaadi</span>
  </div>
</header>

<div class="hero">
  <h2>Your Ride in the Hills</h2>
</div>

<div class="container">

  <div class="input-box">
    <input type="text" id="pickup" placeholder="📍 Pickup Location">
    <button class="loc-btn" onclick="getLocation()">📍</button>
  </div>

  <div class="input-box">
    <input type="text" id="drop" placeholder="🏁 Drop Location">
  </div>

  <div class="vehicle-box">
    <div class="vehicle" onclick="selectVehicle(this,'Bike')">🏍 Bike</div>
    <div class="vehicle" onclick="selectVehicle(this,'Car')">🚗 Car</div>
    <div class="vehicle" onclick="selectVehicle(this,'SUV')">🚙 SUV</div>
  </div>

  <button class="book-btn" onclick="bookRide()">Book Ride</button>
</div>

<div id="map"></div>

<div class="bottom-sheet">
  Distance: <span id="distance">0</span> km <br>
  Fare: ₹<span id="price" class="price">0</span>
</div>

<!-- 🔥 STATUS BOX -->
<div style="text-align:center; margin-top:10px;">
  <b id="statusBox">Status: Not booked</b>
</div>

</div>

<script>
let selectedVehicle = "";
let map, marker, directionsService, directionsRenderer;

function loginUser() {
  let name = document.getElementById("loginName").value;
  let phone = document.getElementById("loginPhone").value;

  if (!name || !phone) {
    alert("Bhai details fill kar 😅");
    return;
  }

  localStorage.setItem("userName", name);
  localStorage.setItem("userPhone", phone);

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("rideScreen").style.display = "block";
}

window.onload = function () {
  let name = localStorage.getItem("userName");
  let phone = localStorage.getItem("userPhone");

  if (name && phone) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("rideScreen").style.display = "block";
  }
}

function initMap() {
  const defaultLocation = { lat: 28.6139, lng: 77.2090 };

  map = new google.maps.Map(document.getElementById("map"), {
    center: defaultLocation,
    zoom: 13,
  });

  marker = new google.maps.Marker({
    position: defaultLocation,
    map: map,
  });

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer();
  directionsRenderer.setMap(map);

  const pickupAuto = new google.maps.places.Autocomplete(document.getElementById("pickup"));
  const dropAuto = new google.maps.places.Autocomplete(document.getElementById("drop"));

  pickupAuto.addListener("place_changed", showRoute);
  dropAuto.addListener("place_changed", showRoute);
}

function getLocation() {
  navigator.geolocation.getCurrentPosition((pos) => {
    const latlng = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
    };

    const geocoder = new google.maps.Geocoder();

    geocoder.geocode({ location: latlng }, (results, status) => {
      if (status === "OK") {
        document.getElementById("pickup").value = results[0].formatted_address;
        map.setCenter(latlng);
        marker.setPosition(latlng);
      }
    });
  });
}

function selectVehicle(el, v) {
  document.querySelectorAll('.vehicle').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  selectedVehicle = v;
  showRoute();
}

function showRoute() {
  let pickup = document.getElementById("pickup").value;
  let drop = document.getElementById("drop").value;

  if (!pickup || !drop) return;

  directionsService.route({
    origin: pickup,
    destination: drop,
    travelMode: 'DRIVING',
  }, function(result, status) {

    if (status === "OK") {
      directionsRenderer.setDirections(result);

      let km = (result.routes[0].legs[0].distance.value / 1000).toFixed(2);

      let rate = selectedVehicle === "Bike" ? 3.5 :
                 selectedVehicle === "Car" ? 5 :
                 selectedVehicle === "SUV" ? 8 : 0;

      let price = km * rate;

      document.getElementById("distance").innerText = km;
      document.getElementById("price").innerText = Math.round(price);
    }
  });
}

function bookRide() {
  let name = localStorage.getItem("userName");
  let phone = localStorage.getItem("userPhone");
  let pickup = document.getElementById("pickup").value;
  let drop = document.getElementById("drop").value;

  if (!pickup || !drop || !selectedVehicle) {
    alert("Bhai sab fill kar 😅");
    return;
  }

  let rideData = {
    name,
    phone,
    pickup,
    drop,
    vehicle: selectedVehicle,
    status: "Pending",
    time: new Date().toISOString()
  };

  saveRideToFirebase(rideData);
  listenRideStatus(phone);

  let msg = `🚕 PahadiGaadi Booking

👤 Name: ${name}
📞 Phone: ${phone}

📍 Pickup: ${pickup}
🏁 Drop: ${drop}
🚗 Vehicle: ${selectedVehicle}`;

  window.open("https://wa.me/919761857987?text=" + encodeURIComponent(msg));
}
</script>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, addDoc, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
  storageBucket: "pahadigaadi.firebasestorage.app",
  messagingSenderId: "465488936633",
  appId: "1:465488936633:web:7e5f46325366bf0bf66568"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveRideToFirebase = async function(data) {
  await addDoc(collection(db, "rides"), data);
};

window.listenRideStatus = function(phone) {
  const q = query(collection(db, "rides"), where("phone", "==", phone));

  onSnapshot(q, (snapshot) => {
    snapshot.forEach((doc) => {
      const ride = doc.data();
      document.getElementById("statusBox").innerText =
        "Status: " + (ride.status || "Pending");
    });
  });
};
</script>

<!-- GOOGLE MAP -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&libraries=places&callback=initMap" async defer></script>

</body>
</html>
