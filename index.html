<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: url('bg.jpg.jpeg') no-repeat center center/cover;
  height: 100vh;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  z-index: -1;
}

.slide-left,
.slide-right {
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  color: #a8324a;
  text-shadow: 0 2px 10px rgba(0,0,0,0.6);
}

.slide-left {
  transform: translateX(-100px);
  opacity: 0;
  animation: slideLeft 0.8s ease forwards;
}

.slide-right {
  transform: translateX(100px);
  opacity: 0;
  animation: slideRight 0.8s ease forwards;
}

.logo-zoom {
  width:55px;
  height:55px;
  border-radius:12px;
  background:white;
  padding:5px;
  transform: scale(0);
  animation: zoomIn 0.6s ease forwards;
  animation-delay: 0.3s;
}

@keyframes slideLeft { to { transform: translateX(0); opacity: 1; } }
@keyframes slideRight { to { transform: translateX(0); opacity: 1; } }
@keyframes zoomIn { to { transform: scale(1); } }

header { text-align:center; padding:20px 10px; overflow:hidden; }
.hero { text-align:center; padding:10px; }

.container {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.input-box { position:relative; margin-bottom:12px; }

.input-box input {
  width:100%;
  padding:14px 40px 14px 14px;
  border-radius:25px;
  border:1px solid #ddd;
}

.loc-btn {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:#0f172a;
  color:white;
  border:none;
  border-radius:50%;
  width:30px;
  height:30px;
}

.vehicle-box { display:flex; gap:10px; }

.vehicle {
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:12px;
  border:2px solid #ddd;
}

.vehicle.active { background:#0f172a; color:white; }

.book-btn {
  width:100%;
  padding:14px;
  background:linear-gradient(45deg,#22c55e,#16a34a);
  color:white;
  border:none;
  border-radius:12px;
  margin-top:15px;
}

#map { height:300px; margin:20px; border-radius:15px; }

.bottom-sheet {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  padding:15px;
}

.price { font-weight:bold; color:green; }
</style>
</head>

<body>

<div id="loginScreen" style="padding:30px; text-align:center;">
  <h2>PahadiGaadi Login</h2>
  <input id="loginName" placeholder="Name"><br><br>
  <input id="loginPhone" placeholder="Phone"><br><br>
  <button onclick="loginUser()">Continue</button>
</div>

<div id="rideScreen" style="display:none;">

<header>
  <span class="slide-left">Pahadi</span>
  <img src="logo.png" class="logo-zoom">
  <span class="slide-right">Gaadi</span>
</header>

<div class="container">
  <input id="pickup" placeholder="Pickup"><br><br>
  <input id="drop" placeholder="Drop"><br><br>

  <div class="vehicle-box">
    <div class="vehicle" onclick="selectVehicle(this,'Bike')">Bike</div>
    <div class="vehicle" onclick="selectVehicle(this,'Car')">Car</div>
    <div class="vehicle" onclick="selectVehicle(this,'SUV')">SUV</div>
  </div>

  <button id="bookRideBtn" onclick="bookRide()">Book Ride</button>
</div>

<div id="map"></div>

<b id="statusBox">Status: Not booked</b>

</div>

<script>
let selectedVehicle="";
let map, directionsService, directionsRenderer;

function loginUser(){
  localStorage.setItem("userName","test");
  localStorage.setItem("userPhone","123");
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("rideScreen").style.display="block";
}

window.onload=function(){
  const rideId=localStorage.getItem("currentRideId");

  if(!rideId){
    localStorage.removeItem("currentRideId");
  }
};

function initMap(){
  map=new google.maps.Map(document.getElementById("map"),{
    center:{lat:28.6,lng:77.2},zoom:10
  });
}

function bookRide(){
  if(localStorage.getItem("currentRideId")){
    alert("Ride already booked");
    return;
  }
  localStorage.setItem("currentRideId","1");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&libraries=places&callback=initMap" async defer></script>

</body>
</html>
