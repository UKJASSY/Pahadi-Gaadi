<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body { margin:0;font-family:'Poppins';background:linear-gradient(to right,#0f172a,#1e293b);color:white;}
header {display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
.logo {display:flex;align-items:center;gap:12px;}
.logo img {width:55px;height:55px;border-radius:10px;background:white;padding:4px;}
.container {background:white;color:black;margin:20px;padding:20px;border-radius:20px;}
.input-box {position:relative;margin-bottom:12px;}
.input-box input {width:100%;padding:14px 40px 14px 14px;border-radius:25px;border:1px solid #ddd;}
.loc-btn {position:absolute;right:10px;top:50%;transform:translateY(-50%);}
.vehicle-box {display:flex;gap:10px;}
.vehicle {flex:1;padding:12px;text-align:center;border-radius:12px;border:2px solid #ddd;cursor:pointer;}
.vehicle.active {background:#0f172a;color:white;}
.book-btn {width:100%;padding:14px;background:green;color:white;border:none;border-radius:12px;margin-top:15px;}
#map {height:300px;margin:20px;border-radius:15px;}
.bottom-sheet {background:white;color:black;padding:15px;}
</style>
</head>

<body>

<div id="loginScreen" style="padding:30px;text-align:center;">
<h2>PahadiGaadi Login</h2>
<input id="loginName" placeholder="Name"><br><br>
<input id="loginPhone" placeholder="Phone"><br><br>
<button class="book-btn" onclick="loginUser()">Continue</button>
</div>

<div id="rideScreen" style="display:none;">

<header>
<div class="logo">
<img src="logo.png">
<span>PahadiGaadi</span>
</div>
</header>

<div class="container">
<input id="pickup" placeholder="Pickup"><br><br>
<input id="drop" placeholder="Drop"><br><br>

<div class="vehicle-box">
<div class="vehicle" onclick="selectVehicle(this,'Bike')">Bike</div>
<div class="vehicle" onclick="selectVehicle(this,'Car')">Car</div>
<div class="vehicle" onclick="selectVehicle(this,'SUV')">SUV</div>
</div>

<button class="book-btn" onclick="bookRide()">Book Ride</button>
</div>

<div id="map"></div>

<div class="bottom-sheet">
Distance: <span id="distance">0</span> km |
Fare: ₹<span id="price">0</span><br>
<b id="statusBox">Status: Not booked</b>
</div>

</div>

<script>
let selectedVehicle="";
let map,marker,directionsService,directionsRenderer;
let driverMarker;

let pickupLat=0;
let pickupLng=0;

function loginUser(){
if(!loginName.value||!loginPhone.value)return alert("Fill details");
localStorage.setItem("userName",loginName.value);
localStorage.setItem("userPhone",loginPhone.value);
loginScreen.style.display="none";
rideScreen.style.display="block";
}

window.onload=()=>{
if(localStorage.getItem("userName")){
loginScreen.style.display="none";
rideScreen.style.display="block";
}
};

function initMap(){
const def={lat:28.6139,lng:77.2090};
map=new google.maps.Map(document.getElementById("map"),{center:def,zoom:13});
marker=new google.maps.Marker({position:def,map});

directionsService=new google.maps.DirectionsService();
directionsRenderer=new google.maps.DirectionsRenderer({map});

setTimeout(()=>listenDriverLocation(),1000);
}

function listenDriverLocation(){
if(!window.db)return;

const ref=window.doc(window.db,"drivers","driver1");

window.onSnapshot(ref,(snap)=>{
if(!snap.exists())return;

const d=snap.data();
const pos={lat:d.lat,lng:d.lng};

if(!driverMarker){
driverMarker=new google.maps.Marker({
position:pos,map,
icon:"https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
});
}else driverMarker.setPosition(pos);
});
}

function selectVehicle(el,v){
document.querySelectorAll('.vehicle').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
selectedVehicle=v;
showRoute();
}

function showRoute(){
let p=pickup.value,d=drop.value;
if(!p||!d)return;

directionsService.route({
origin:p,destination:d,travelMode:'DRIVING'
},(res,st)=>{
if(st==="OK"){
directionsRenderer.setDirections(res);

let leg=res.routes[0].legs[0];
pickupLat=leg.start_location.lat();
pickupLng=leg.start_location.lng();

let km=(leg.distance.value/1000).toFixed(2);
let rate=selectedVehicle=="Bike"?3.5:selectedVehicle=="Car"?5:selectedVehicle=="SUV"?8:0;

distance.innerText=km;
price.innerText=Math.round(km*rate);
}
});
}

function bookRide(){
if(!pickup.value||!drop.value||!selectedVehicle)return alert("Fill all");

let km=parseFloat(distance.innerText)||0;

saveRideToFirebase({
name:localStorage.getItem("userName"),
phone:localStorage.getItem("userPhone"),
pickup:pickup.value,
drop:drop.value,
vehicle:selectedVehicle,
distance:km,
status:"Pending",
driverId:null,
pickupLat:pickupLat,
pickupLng:pickupLng,
time:new Date().toISOString()
}).then(id=>{
listenRideStatus(id);
});
}
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {getFirestore,addDoc,collection,onSnapshot,doc}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
authDomain:"pahadigaadi.firebaseapp.com",
projectId:"pahadigaadi"
});

window.db=getFirestore(app);
window.doc=doc;
window.onSnapshot=onSnapshot;

window.saveRideToFirebase=async(data)=>{
const r=await addDoc(collection(db,"rides"),data);
return r.id;
};

window.listenRideStatus=(id)=>{
const ref=doc(db,"rides",id);
onSnapshot(ref,(snap)=>{
if(snap.exists()){
statusBox.innerText="Status: "+snap.data().status;
}
});
};
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&libraries=places&callback=initMap" async defer></script>

</body>
</html>
