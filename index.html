<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to right, #0f172a, #1e293b);
  color: white;
}

/* 🔥 HEADER ANIMATION CSS */
.slide-left {
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  transform: translateX(-100px);
  opacity: 0;
  animation: slideLeft 0.8s ease forwards;
}

.slide-right {
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  transform: translateX(100px);
  opacity: 0;
  animation: slideRight 0.8s ease forwards;
}

.logo-zoom {
  width:55px;
  height:55px;
  border-radius:12px;
  background:white;
  padding:5px;
  transform: scale(0);
  animation: zoomIn 0.6s ease forwards;
  animation-delay: 0.3s;
}

@keyframes slideLeft {
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes slideRight {
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes zoomIn {
  to {
    transform: scale(1);
  }
}

header {
  text-align: center;
  padding: 20px 10px;
  overflow: hidden;
}

.hero { text-align: center; padding: 10px; }

.container {
  background: white;
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}

.input-box {
  position: relative;
  margin-bottom: 12px;
}

.input-box input {
  width: 100%;
  padding: 14px 40px 14px 14px;
  border-radius: 25px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.loc-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: #0f172a;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
}

.vehicle-box {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.vehicle {
  flex: 1;
  padding: 12px;
  text-align: center;
  border-radius: 12px;
  border: 2px solid #ddd;
  cursor: pointer;
}

.vehicle.active {
  background: #0f172a;
  color: white;
}

.book-btn {
  width: 100%;
  padding: 14px;
  background: green;
  color: white;
  border: none;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 16px;
}

#map {
  height: 300px;
  margin: 20px;
  border-radius: 15px;
}

.bottom-sheet {
  background: white;
  color: black;
  padding: 15px;
}

.price {
  font-weight: bold;
  color: green;
}
</style>
</head>

<body>

<div id="loginScreen" style="padding:30px; text-align:center;">
  <h2>PahadiGaadi Login</h2>

  <div class="input-box">
    <input type="text" id="loginName" placeholder="👤 Your Name">
  </div>

  <div class="input-box">
    <input type="tel" id="loginPhone" placeholder="📞 Phone Number">
  </div>

  <button class="book-btn" onclick="loginUser()">Continue</button>
</div>

<div id="rideScreen" style="display:none;">

<!-- 🔥 ANIMATED HEADER -->
<header>
  <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
    
    <span class="slide-left">Pahadi</span>

    <img src="logo.png" class="logo-zoom">

    <span class="slide-right">Gaadi</span>

  </div>
</header>

<div class="hero">
  <h2>Your Ride in the Hills</h2>
</div>

<div class="container">

  <div class="input-box">
    <input type="text" id="pickup" placeholder="📍 Pickup Location">
    <button class="loc-btn" onclick="getLocation()">📍</button>
  </div>

  <div class="input-box">
    <input type="text" id="drop" placeholder="🏁 Drop Location">
  </div>

  <div class="vehicle-box">
    <div class="vehicle" onclick="selectVehicle(this,'Bike')">🏍 Bike</div>
    <div class="vehicle" onclick="selectVehicle(this,'Car')">🚗 Car</div>
    <div class="vehicle" onclick="selectVehicle(this,'SUV')">🚙 SUV</div>
  </div>

  <button id="bookRideBtn" class="book-btn" onclick="bookRide()">Book Ride</button>
</div>

<div id="map"></div>

<div class="bottom-sheet">
  Distance: <span id="distance">0</span> km <br>
  Fare: ₹<span id="price" class="price">0</span>
</div>

<div style="text-align:center; margin-top:10px;">
  <b id="statusBox">Status: Not booked</b>
</div>

</div>

<!-- ⚠️ JS SAME AS BEFORE (unchanged) -->
<script>
/* SAME JS — unchanged */
</script>

<script type="module">
/* SAME FIREBASE CODE — unchanged */
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&libraries=places&callback=initMap" async defer></script>

</body>
</html>
