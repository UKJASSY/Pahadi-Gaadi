<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to right, #0f172a, #1e293b);
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo img {
  width: 55px;
  height: 55px;
  border-radius: 10px;
  background: white;
  padding: 4px;
}

.hero { text-align: center; padding: 10px; }

.container {
  background: white;
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}

.input-box {
  position: relative;
  margin-bottom: 12px;
}

.input-box input {
  width: 100%;
  padding: 14px 40px 14px 14px;
  border-radius: 25px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.loc-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: #0f172a;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
}

.vehicle-box {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.vehicle {
  flex: 1;
  padding: 12px;
  text-align: center;
  border-radius: 12px;
  border: 2px solid #ddd;
  cursor: pointer;
}

.vehicle.active {
  background: #0f172a;
  color: white;
}

.book-btn {
  width: 100%;
  padding: 14px;
  background: green;
  color: white;
  border: none;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 16px;
}

#map {
  height: 300px;
  margin: 20px;
  border-radius: 15px;
}

.bottom-sheet {
  background: white;
  color: black;
  padding: 15px;
}

.price {
  font-weight: bold;
  color: green;
}
</style>
</head>

<body>

<div id="loginScreen" style="padding:30px; text-align:center;">
  <h2>PahadiGaadi Login</h2>
  <div class="input-box">
    <input type="text" id="loginName" placeholder="👤 Your Name">
  </div>
  <div class="input-box">
    <input type="tel" id="loginPhone" placeholder="📞 Phone Number">
  </div>
  <button class="book-btn" onclick="loginUser()">Continue</button>
</div>

<div id="rideScreen" style="display:none;">

<header>
  <div class="logo">
    <img src="logo.png">
    <span>PahadiGaadi</span>
  </div>
</header>

<div class="hero">
  <h2>Your Ride in the Hills</h2>
</div>

<div class="container">

  <div class="input-box">
    <input type="text" id="pickup" placeholder="📍 Pickup Location">
    <button class="loc-btn" onclick="getLocation()">📍</button>
  </div>

  <div class="input-box">
    <input type="text" id="drop" placeholder="🏁 Drop Location">
  </div>

  <div class="vehicle-box">
    <div class="vehicle" onclick="selectVehicle(this,'Bike')">🏍 Bike</div>
    <div class="vehicle" onclick="selectVehicle(this,'Car')">🚗 Car</div>
    <div class="vehicle" onclick="selectVehicle(this,'SUV')">🚙 SUV</div>
  </div>

  <button class="book-btn" onclick="bookRide()">Book Ride</button>
</div>

<div id="map"></div>

<div class="bottom-sheet">
  Distance: <span id="distance">0</span> km <br>
  Fare: ₹<span id="price" class="price">0</span> <br>
  ETA: <span id="eta">--</span> min
</div>

<div style="text-align:center; margin-top:10px;">
  <b id="statusBox">Status: Not booked</b>
</div>

</div>

<script>
let selectedVehicle = "";
let map, marker, directionsService, directionsRenderer;
let driverMarker;
let driverDirectionsService, driverDirectionsRenderer;

function loginUser() {
  let name = document.getElementById("loginName").value;
  let phone = document.getElementById("loginPhone").value;

  if (!name || !phone) {
    alert("Bhai details fill kar 😅");
    return;
  }

  localStorage.setItem("userName", name);
  localStorage.setItem("userPhone", phone);

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("rideScreen").style.display = "block";
}

window.onload = function () {
  let name = localStorage.getItem("userName");
  let phone = localStorage.getItem("userPhone");

  if (name && phone) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("rideScreen").style.display = "block";
  }
}

function initMap() {
  const defaultLocation = { lat: 28.6139, lng: 77.2090 };

  map = new google.maps.Map(document.getElementById("map"), {
    center: defaultLocation,
    zoom: 13,
  });

  marker = new google.maps.Marker({
    position: defaultLocation,
    map: map,
  });

  driverMarker = new google.maps.Marker({
    position: { lat: 0, lng: 0 },
    map: map,
    icon: "https://maps.google.com/mapfiles/ms/icons/green-dot.png"
  });

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer();
  directionsRenderer.setMap(map);

  driverDirectionsService = new google.maps.DirectionsService();
  driverDirectionsRenderer = new google.maps.DirectionsRenderer({
    polylineOptions: { strokeColor: "#00ff00", strokeWeight: 5 }
  });
  driverDirectionsRenderer.setMap(map);

  listenDriverLocation();
}

function selectVehicle(el, v) {
  document.querySelectorAll('.vehicle').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  selectedVehicle = v;
}

function bookRide() {
  let name = localStorage.getItem("userName");
  let phone = localStorage.getItem("userPhone");
  let pickup = document.getElementById("pickup").value;
  let drop = document.getElementById("drop").value;

  if (!pickup || !drop || !selectedVehicle) {
    alert("Fill all fields");
    return;
  }

  let km = parseFloat(document.getElementById("distance").innerText) || 0;

  let rideData = {
    name,
    phone,
    pickup,
    drop,
    vehicle: selectedVehicle,
    distance: km,
    status: "Pending",
    driverId: "driver1",
    time: new Date().toISOString()
  };

  saveRideToFirebase(rideData).then((rideId) => {
    listenRideStatus(rideId);
  });
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, addDoc, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = { /* same */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveRideToFirebase = async function(data) {
  const ref = await addDoc(collection(db, "rides"), data);
  return ref.id;
};

window.listenRideStatus = function(id) {
  onSnapshot(doc(db, "rides", id), (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      document.getElementById("statusBox").innerText = "Status: " + data.status;

      if (data.status === "Completed") {
        driverDirectionsRenderer.set("directions", null);
        document.getElementById("eta").innerText = "--";
      }
    }
  });
};

window.listenDriverLocation = function() {
  onSnapshot(doc(db, "drivers", "driver1"), (snap) => {
    if (!snap.exists()) return;

    const d = snap.data();
    const pos = { lat: d.lat, lng: d.lng };

    driverMarker.setPosition(pos);

    const pickup = document.getElementById("pickup").value;
    if (!pickup) return;

    driverDirectionsService.route({
      origin: pos,
      destination: pickup,
      travelMode: "DRIVING"
    }, (res, status) => {
      if (status === "OK") {
        driverDirectionsRenderer.setDirections(res);
        const min = Math.ceil(res.routes[0].legs[0].duration.value / 60);
        document.getElementById("eta").innerText = min;
      }
    });
  });
};
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&callback=initMap" async defer></script>

</body>
</html>
