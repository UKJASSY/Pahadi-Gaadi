<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: url('bg.jpg.jpeg') no-repeat center center/cover;
  height: 100vh;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  z-index: -1;
}

header { text-align:center; padding:20px 10px; }

.container {
  background: rgba(255,255,255,0.9);
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}

.vehicle-box { display:flex; gap:10px; }
.vehicle { flex:1; padding:10px; border:1px solid #ddd; cursor:pointer; }
.vehicle.active { background:black; color:white; }

.book-btn {
  width:100%;
  padding:14px;
  background:green;
  color:white;
  border:none;
  border-radius:10px;
}

#map { height:300px; margin:20px; }
</style>
</head>

<body>

<div class="container">

<input id="pickup" placeholder="Pickup"><br><br>
<input id="drop" placeholder="Drop"><br><br>

<div class="vehicle-box">
<div class="vehicle" onclick="selectVehicle(this,'Bike')">Bike</div>
<div class="vehicle" onclick="selectVehicle(this,'Car')">Car</div>
<div class="vehicle" onclick="selectVehicle(this,'SUV')">SUV</div>
</div>

<br>
<button class="book-btn" onclick="bookRide()">Book Ride</button>

</div>

<div id="map"></div>

<script>
let selectedVehicle="";
let map, directionsService, directionsRenderer;
let pickupLat=0, pickupLng=0;

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: {lat:28.6,lng:77.2},
    zoom:13
  });

  directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer();
  directionsRenderer.setMap(map);
}

function selectVehicle(el,v){
  document.querySelectorAll('.vehicle').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  selectedVehicle=v;
}

function bookRide(){

  let pickup=document.getElementById("pickup").value;
  let drop=document.getElementById("drop").value;

  if(!pickup || !drop || !selectedVehicle){
    alert("Fill all");
    return;
  }

  let rideData={
    pickup,
    drop,
    vehicle:selectedVehicle,
    status:"Pending",
    pickupLat:pickupLat,
    pickupLng:pickupLng,
    time:new Date().toISOString()
  };

  saveRideToFirebase(rideData);
}
</script>

<!-- ✅ FIREBASE FIX -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveRideToFirebase = async function(data){
  await addDoc(collection(db,"rides"),data);
  alert("Ride sent to driver ✅");
};
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&callback=initMap" async defer></script>

</body>
</html>
