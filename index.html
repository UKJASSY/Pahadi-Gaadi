<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to right, #0f172a, #1e293b);
  color: white;
}

/* 🔥 HEADER ANIMATION CSS */
.slide-left {
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  transform: translateX(-100px);
  opacity: 0;
  animation: slideLeft 0.8s ease forwards;
}

.slide-right {
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  transform: translateX(100px);
  opacity: 0;
  animation: slideRight 0.8s ease forwards;
}

.logo-zoom {
  width:55px;
  height:55px;
  border-radius:12px;
  background:white;
  padding:5px;
  transform: scale(0);
  animation: zoomIn 0.6s ease forwards;
  animation-delay: 0.3s;
}

@keyframes slideLeft {
  to { transform: translateX(0); opacity: 1; }
}

@keyframes slideRight {
  to { transform: translateX(0); opacity: 1; }
}

@keyframes zoomIn {
  to { transform: scale(1); }
}

header {
  text-align: center;
  padding: 20px 10px;
  overflow: hidden;
}

.hero { text-align: center; padding: 10px; }

.container {
  background: white;
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}

.input-box {
  position: relative;
  margin-bottom: 12px;
}

.input-box input {
  width: 100%;
  padding: 14px 40px 14px 14px;
  border-radius: 25px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.loc-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: #0f172a;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
}

.vehicle-box {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.vehicle {
  flex: 1;
  padding: 12px;
  text-align: center;
  border-radius: 12px;
  border: 2px solid #ddd;
  cursor: pointer;
}

.vehicle.active {
  background: #0f172a;
  color: white;
}

.book-btn {
  width: 100%;
  padding: 14px;
  background: green;
  color: white;
  border: none;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 16px;
}

#map {
  height: 300px;
  margin: 20px;
  border-radius: 15px;
}

.bottom-sheet {
  background: white;
  color: black;
  padding: 15px;
}

.price {
  font-weight: bold;
  color: green;
}
</style>
</head>

<body>

<div id="loginScreen" style="padding:30px; text-align:center;">
  <h2>PahadiGaadi Login</h2>

  <div class="input-box">
    <input type="text" id="loginName" placeholder="👤 Your Name">
  </div>

  <div class="input-box">
    <input type="tel" id="loginPhone" placeholder="📞 Phone Number">
  </div>

  <button class="book-btn" onclick="loginUser()">Continue</button>
</div>

<div id="rideScreen" style="display:none;">

<!-- 🔥 ANIMATED HEADER -->
<header>
  <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
    <span class="slide-left">Pahadi</span>
    <img src="logo.png" class="logo-zoom">
    <span class="slide-right">Gaadi</span>
  </div>
</header>

<div class="hero">
  <h2>Your Ride in the Hills</h2>
</div>

<div class="container">

  <div class="input-box">
    <input type="text" id="pickup" placeholder="📍 Pickup Location">
    <button class="loc-btn" onclick="getLocation()">📍</button>
  </div>

  <div class="input-box">
    <input type="text" id="drop" placeholder="🏁 Drop Location">
  </div>

  <div class="vehicle-box">
    <div class="vehicle" onclick="selectVehicle(this,'Bike')">🏍 Bike</div>
    <div class="vehicle" onclick="selectVehicle(this,'Car')">🚗 Car</div>
    <div class="vehicle" onclick="selectVehicle(this,'SUV')">🚙 SUV</div>
  </div>

  <button id="bookRideBtn" class="book-btn" onclick="bookRide()">Book Ride</button>
</div>

<div id="map"></div>

<div class="bottom-sheet">
  Distance: <span id="distance">0</span> km <br>
  Fare: ₹<span id="price" class="price">0</span>
</div>

<div style="text-align:center; margin-top:10px;">
  <b id="statusBox">Status: Not booked</b>
</div>

</div>

<script>
let selectedVehicle = "";
let map, marker, directionsService, directionsRenderer;

let driverMarker;
let driverDirectionsService;
let driverDirectionsRenderer;

let pickupLat = 0;
let pickupLng = 0;

function loginUser() {
  let name = document.getElementById("loginName").value;
  let phone = document.getElementById("loginPhone").value;

  if (!name || !phone) {
    alert("Bhai details fill kar 😅");
    return;
  }

  localStorage.setItem("userName", name);
  localStorage.setItem("userPhone", phone);

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("rideScreen").style.display = "block";
}

window.onload = function () {
  let name = localStorage.getItem("userName");
  let phone = localStorage.getItem("userPhone");

  if (name && phone) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("rideScreen").style.display = "block";
  }

  const rideId = localStorage.getItem("currentRideId");
  if (rideId) {
    listenRideStatus(rideId);
  }
}

function initMap() {
  const defaultLocation = { lat: 28.6139, lng: 77.2090 };

  map = new google.maps.Map(document.getElementById("map"), {
    center: defaultLocation,
    zoom: 13,
  });

  marker = new google.maps.Marker({
    position: defaultLocation,
    map: map,
  });

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer();
  directionsRenderer.setMap(map);

  driverDirectionsService = new google.maps.DirectionsService();
  driverDirectionsRenderer = new google.maps.DirectionsRenderer({
    polylineOptions: { strokeColor: "#00ff00", strokeWeight: 5 }
  });
  driverDirectionsRenderer.setMap(map);

  const pickupAuto = new google.maps.places.Autocomplete(document.getElementById("pickup"));
  const dropAuto = new google.maps.places.Autocomplete(document.getElementById("drop"));

  pickupAuto.addListener("place_changed", showRoute);
  dropAuto.addListener("place_changed", showRoute);

  listenDriverLocation();
}

function listenDriverLocation() {
  const ref = doc(db, "drivers", "driver1");

  onSnapshot(ref, (docSnap) => {
    if (!docSnap.exists()) return;

    const data = docSnap.data();
    const driverPos = { lat: data.lat, lng: data.lng };

    if (!driverMarker) {
      driverMarker = new google.maps.Marker({
        position: driverPos,
        map: map,
        icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
      });
    } else {
      driverMarker.setPosition(driverPos);
    }
  });
}

function selectVehicle(el, v) {
  document.querySelectorAll('.vehicle').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  selectedVehicle = v;
  showRoute();
}

function showRoute() {
  let pickup = document.getElementById("pickup").value;
  let drop = document.getElementById("drop").value;

  if (!pickup || !drop) return;

  directionsService.route({
    origin: pickup,
    destination: drop,
    travelMode: 'DRIVING',
  }, function(result, status) {

    if (status === "OK") {
      directionsRenderer.setDirections(result);

      let leg = result.routes[0].legs[0];

      pickupLat = leg.start_location.lat();
      pickupLng = leg.start_location.lng();

      let km = (leg.distance.value / 1000).toFixed(2);

      let rate = selectedVehicle === "Bike" ? 3.5 :
                 selectedVehicle === "Car" ? 5 :
                 selectedVehicle === "SUV" ? 8 : 0;

      let price = km * rate;

      document.getElementById("distance").innerText = km;
      document.getElementById("price").innerText = Math.round(price);
    }
  });
}

function bookRide() {
  let name = localStorage.getItem("userName");
  let phone = localStorage.getItem("userPhone");
  let pickup = document.getElementById("pickup").value;
  let drop = document.getElementById("drop").value;

  if (!pickup || !drop || !selectedVehicle) {
    alert("Bhai sab fill kar 😅");
    return;
  }

  let km = parseFloat(document.getElementById("distance").innerText) || 0;

  let rideData = {
    name,
    phone,
    pickup,
    drop,
    vehicle: selectedVehicle,
    distance: km,
    status: "Pending",
    driverId: null,
    pickupLat: pickupLat,
    pickupLng: pickupLng,
    time: new Date().toISOString()
  };

  saveRideToFirebase(rideData).then((rideId) => {
    localStorage.setItem("currentRideId", rideId);
    listenRideStatus(rideId);
  });
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, addDoc, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
};

const app = initializeApp(firebaseConfig);

window.db = getFirestore(app);
window.doc = doc;
window.onSnapshot = onSnapshot;

window.saveRideToFirebase = async function(data) {
  const docRef = await addDoc(collection(db, "rides"), data);
  return docRef.id;
};

window.listenRideStatus = function(rideId) {
  const ref = doc(db, "rides", rideId);

  onSnapshot(ref, (docSnap) => {
    if (docSnap.exists()) {
      const ride = docSnap.data();

      let status = (ride.status || "pending").toLowerCase();

      document.getElementById("statusBox").innerText =
        "Status: " + status;

      const bookBtn = document.getElementById("bookRideBtn");

      if (status === "accepted") {
        bookBtn.innerText = "Booked";
        bookBtn.disabled = true;
        bookBtn.style.backgroundColor = "gray";
      }
    }
  });
};
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&libraries=places&callback=initMap" async defer></script>

</body>
</html>
