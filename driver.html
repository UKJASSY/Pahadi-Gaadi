<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;

  /* 🔥 SAME BACKGROUND */
  background: url('bg.jpg.jpeg') no-repeat center center/cover;
  height: 100vh;
  color: white;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  z-index: -1;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px 10px;
}

.brand {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  font-size: 28px;
  font-weight: 800;
  color: #a8324a;
}

.brand img {
  width: 55px;
  height: 55px;
  border-radius: 10px;
  background: white;
  padding: 5px;
}

.sub {
  font-size: 16px;
  margin-top: 5px;
  opacity: 0.8;
}

/* GLASS CONTAINER */
.container {
  background: rgba(255,255,255,0.9);
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}

.card {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
}

.accept { background: #16a34a; }
.start { background: orange; }
.end { background: red; }

.earning {
  color: green;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">
    <span>Pahadi</span>
    <img src="logo.png">
    <span>Gaadi</span>
  </div>
  <div class="sub">Driver</div>
</div>

<div class="container">
  <h2>🚗 Driver Panel</h2>
  <div id="rides"></div>
</div>

<script type="module">
/* 🔥 SAME ORIGINAL CODE — UNTOUCHED */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  query,
  where,
  increment,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
  storageBucket: "pahadigaadi.firebasestorage.app",
  messagingSenderId: "465488936633",
  appId: "1:465488936633:web:7e5f46325366bf0bf66568"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ridesDiv = document.getElementById("rides");
const driverId = "driver1";

let driverLat = 0;
let driverLng = 0;

function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

const q = query(
  collection(db, "rides"),
  where("status", "==", "Pending")
);

onSnapshot(q, (snapshot) => {
  ridesDiv.innerHTML = "";

  let rides = [];

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();

    if (!data.pickupLat || !data.pickupLng) return;

    const dist = getDistance(
      driverLat,
      driverLng,
      data.pickupLat,
      data.pickupLng
    );

    rides.push({
      id: docSnap.id,
      ...data,
      distanceFromDriver: dist
    });
  });

  rides.sort((a, b) => a.distanceFromDriver - b.distanceFromDriver);

  rides.slice(0, 3).forEach((data) => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      📍 ${data.pickup || "-"} <br>
      🏁 ${data.drop || "-"} <br>
      🚗 ${data.vehicle || "-"} <br>
      📏 Ride Distance: ${data.distance || 0} km <br>
      📍 Driver se: ${data.distanceFromDriver.toFixed(2)} km <br>
      <b>Status: ${data.status}</b>
    `;

    const btn = document.createElement("button");
    btn.className = "accept";
    btn.innerText = "Accept Ride";

    btn.onclick = async () => {
      await updateDoc(doc(db, "rides", data.id), {
        status: "Accepted",
        driverId: driverId
      });
    };

    card.appendChild(btn);
    ridesDiv.appendChild(card);
  });
});

let lastUpdate = 0;

navigator.geolocation.watchPosition(async (pos) => {

  const now = Date.now();
  if (now - lastUpdate < 3000) return;
  lastUpdate = now;

  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  driverLat = lat;
  driverLng = lng;

  const driverRef = doc(db, "drivers", driverId);

  try {
    await updateDoc(driverRef, {
      lat,
      lng,
      lastUpdated: new Date().toISOString()
    });
  } catch (e) {
    await setDoc(driverRef, {
      lat,
      lng,
      totalEarning: 0
    });
  }

}, (err) => {
  console.log("Location error:", err);
}, {
  enableHighAccuracy: true
});

</script>

</body>
</html>
