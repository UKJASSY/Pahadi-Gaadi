<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  background: white;
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}

.card {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: none;
  border-radius: 8px;
  color: white;
}

.accept { background: green; }
.start { background: orange; }
.end { background: red; }
.nav { background: blue; }

#map {
  height: 250px;
  margin: 20px;
  border-radius: 15px;
}

.earning {
  color: green;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>🚗 PahadiGaadi Driver</h2>
  <div id="rides"></div>
</div>

<!-- 🗺️ MAP -->
<div id="map"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  query,
  where,
  increment
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
  storageBucket: "pahadigaadi.firebasestorage.app",
  messagingSenderId: "465488936633",
  appId: "1:465488936633:web:7e5f46325366bf0bf66568"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ridesDiv = document.getElementById("rides");
const driverId = "driver1";

// 🗺️ MAP VARS
let map, directionsService, directionsRenderer;

// INIT MAP
window.initMap = function () {
  const defaultLoc = { lat: 28.6139, lng: 77.2090 };

  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 13,
    center: defaultLoc
  });

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer();
  directionsRenderer.setMap(map);
};

// SHOW ROUTE
function showRoute(pickup, drop) {
  if (!pickup || !drop) return;

  directionsService.route({
    origin: pickup,
    destination: drop,
    travelMode: "DRIVING"
  }, (result, status) => {
    if (status === "OK") {
      directionsRenderer.setDirections(result);
    }
  });
}

// 🔥 ONLY MY RIDES
const q = query(
  collection(db, "rides"),
  where("driverId", "==", driverId)
);

onSnapshot(q, (snapshot) => {
  ridesDiv.innerHTML = "";

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      📍 ${data.pickup || "-"} <br>
      🏁 ${data.drop || "-"} <br>
      🚗 ${data.vehicle || "-"} <br>
      📏 Distance: ${data.distance || 0} km <br>
      <b>Status: ${data.status}</b>
      ${data.earning ? `<div class="earning">💰 ₹${data.earning}</div>` : ""}
    `;

    // 🧭 NAV BUTTON
    const navBtn = document.createElement("button");
    navBtn.className = "nav";
    navBtn.innerText = "Navigate 🚗";

    navBtn.onclick = () => {
      const url = `https://www.google.com/maps/dir/?api=1&origin=${data.pickup}&destination=${data.drop}&travelmode=driving`;
      window.open(url, "_blank");
    };

    card.appendChild(navBtn);

    // 🗺️ SHOW ROUTE ON MAP
    showRoute(data.pickup, data.drop);

    // ACCEPT
    if (data.status === "Pending") {
      const btn = document.createElement("button");
      btn.className = "accept";
      btn.innerText = "Accept Ride";

      btn.onclick = async () => {
        await updateDoc(doc(db, "rides", docSnap.id), {
          status: "Accepted"
        });
      };

      card.appendChild(btn);
    }

    // START
    if (data.status === "Accepted") {
      const btn = document.createElement("button");
      btn.className = "start";
      btn.innerText = "Start Ride";

      btn.onclick = async () => {
        await updateDoc(doc(db, "rides", docSnap.id), {
          status: "Started"
        });
      };

      card.appendChild(btn);
    }

    // END
    if (data.status === "Started") {
      const btn = document.createElement("button");
      btn.className = "end";
      btn.innerText = "End Ride";

      btn.onclick = async () => {

        let km = data.distance || 0;

        let rate =
          data.vehicle === "Bike" ? 3 :
          data.vehicle === "Car" ? 4 :
          data.vehicle === "SUV" ? 6.5 : 0;

        let earning = km * rate;

        await updateDoc(doc(db, "rides", docSnap.id), {
          status: "Completed",
          earning: earning
        });

        await updateDoc(doc(db, "drivers", driverId), {
          totalEarning: increment(earning)
        });
      };

      card.appendChild(btn);
    }

    ridesDiv.appendChild(card);
  });
});
