<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}
.container {
  background: white;
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
}
.card {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}
button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: none;
  border-radius: 8px;
  color: white;
}
.accept { background: green; }
.start { background: orange; }
.end { background: red; }
.earning {
  color: green;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>🚗 PahadiGaadi Driver</h2>
  <div id="rides"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  query,
  where,
  increment,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
  storageBucket: "pahadigaadi.firebasestorage.app",
  messagingSenderId: "465488936633",
  appId: "1:465488936633:web:7e5f46325366bf0bf66568"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ridesDiv = document.getElementById("rides");
const driverId = "driver1";

// 📍 DRIVER LOCATION (GLOBAL)
let driverLat = 0;
let driverLng = 0;

// 📏 DISTANCE FUNCTION (HAVERSINE)
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// 🔥 NEAREST RIDES QUERY (Pending rides)
const q = query(
  collection(db, "rides"),
  where("status", "==", "Pending")
);

onSnapshot(q, (snapshot) => {
  ridesDiv.innerHTML = "";

  let rides = [];

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();

    // ⚠️ Need pickupLat/Lng
    if (!data.pickupLat || !data.pickupLng) return;

    const dist = getDistance(
      driverLat,
      driverLng,
      data.pickupLat,
      data.pickupLng
    );

    rides.push({
      id: docSnap.id,
      ...data,
      distanceFromDriver: dist
    });
  });

  // 🔥 sort nearest first
  rides.sort((a, b) => a.distanceFromDriver - b.distanceFromDriver);

  // 👉 show top 3 nearest rides
  rides.slice(0, 3).forEach((data) => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      📍 ${data.pickup || "-"} <br>
      🏁 ${data.drop || "-"} <br>
      🚗 ${data.vehicle || "-"} <br>
      📏 Ride Distance: ${data.distance || 0} km <br>
      📍 Driver se: ${data.distanceFromDriver.toFixed(2)} km <br>
      <b>Status: ${data.status}</b>
    `;

    // ACCEPT
    const btn = document.createElement("button");
    btn.className = "accept";
    btn.innerText = "Accept Ride";

    btn.onclick = async () => {
      await updateDoc(doc(db, "rides", data.id), {
        status: "Accepted",
        driverId: driverId
      });
    };

    card.appendChild(btn);
    ridesDiv.appendChild(card);
  });
});

// 📍 DRIVER LIVE LOCATION (FIXED + THROTTLED)
let lastUpdate = 0;

navigator.geolocation.watchPosition(async (pos) => {

  const now = Date.now();
  if (now - lastUpdate < 3000) return;
  lastUpdate = now;

  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  driverLat = lat;
  driverLng = lng;

  const driverRef = doc(db, "drivers", driverId);

  try {
    await updateDoc(driverRef, {
      lat,
      lng,
      lastUpdated: new Date().toISOString()
    });
  } catch (e) {
    await setDoc(driverRef, {
      lat,
      lng,
      totalEarning: 0
    });
  }

}, (err) => {
  console.log("Location error:", err);
}, {
  enableHighAccuracy: true
});

</script>

</body>
</html>
