<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {

  margin:0;

  font-family: Arial, sans-serif;

  background:
  linear-gradient(
    rgba(2,6,23,0.88),
    rgba(2,6,23,0.92)
  ),

  url('bg.jpg.jpeg');

  background-size: cover;

  background-position:center;

  background-attachment:fixed;

  min-height:100vh;

  color:white;

  overflow-x:hidden;
}
/* overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  z-index: -1;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px 10px;
}

.brand {

  display:flex;

  justify-content:center;

  align-items:center;

  gap:14px;

  font-size:38px;

  font-weight:800;

  color:#f8fafc;

  text-shadow:

  0 0 15px rgba(59,130,246,0.55),

  0 0 35px rgba(34,197,94,0.18);
}
.brand img {

  width:62px;

  height:62px;

  border-radius:18px;

  background:white;

  padding:6px;

  box-shadow:

  0 0 25px rgba(59,130,246,0.35);
}

.sub {
  font-size: 16px;
  margin-top: 5px;
  opacity: 0.8;
}

/* GLASS CONTAINER */
.container {

  background:
  rgba(15,23,42,0.72);

  border:
  1px solid rgba(255,255,255,0.08);

  margin:20px;

  padding:22px;

  border-radius:30px;

  backdrop-filter: blur(18px);

  -webkit-backdrop-filter: blur(18px);

  box-shadow:

  0 0 25px rgba(59,130,246,0.18),

  0 0 60px rgba(34,197,94,0.08),

  inset 0 0 0.5px rgba(255,255,255,0.25);

  color:white;
}

.card {

  background:
  linear-gradient(
    145deg,
    rgba(15,23,42,0.95),
    rgba(30,41,59,0.88)
  );

  border:
  1px solid rgba(255,255,255,0.06);

  padding:18px;

  border-radius:22px;

  margin-bottom:16px;

  color:white;

  box-shadow:

  0 0 20px rgba(59,130,246,0.12),

  inset 0 0 0.5px rgba(255,255,255,0.2);
}

button {

  width:100%;

  padding:14px;

  margin-top:10px;

  border:none;

  border-radius:18px;

  color:white;

  font-weight:700;

  font-size:16px;

  cursor:pointer;

  transition:0.3s;

  box-shadow:
  0 0 20px rgba(59,130,246,0.25);

}
  #loginBox{

  background:rgba(8,15,40,0.78);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 0 35px rgba(0,140,255,0.18),
    inset 0 0 20px rgba(255,255,255,0.03);

  border-radius:30px;

  padding:28px;

  margin-top:35px;

}

#loginBox input{

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.08);

  color:white;

  font-size:16px;

  backdrop-filter:blur(10px);

  box-shadow:
    0 0 12px rgba(0,140,255,0.12);

}

#loginBox input::placeholder{

  color:rgba(255,255,255,0.6);

}

#loginBox h2{

  color:white;

  font-size:32px;

  text-align:center;

  margin-bottom:25px;

  text-shadow:
    0 0 15px rgba(0,140,255,0.5);

}
  #logoutBtn{

  width:200px;

  margin:20px auto;

  display:block;

  padding:14px;

  border:none;

  border-radius:18px;

  background:linear-gradient(135deg,#ef4444,#dc2626);

  color:white;

  font-weight:700;

  font-size:16px;

  cursor:pointer;

  box-shadow:0 0 20px rgba(239,68,68,0.45);

}

.accept {
  background:
  linear-gradient(135deg,#22c55e,#16a34a);
}
.start {
  background:
  linear-gradient(135deg,#f59e0b,#f97316);
}
.end {
  background:
  linear-gradient(135deg,#ef4444,#dc2626);
}

.earning {
  color: green;
  font-weight: bold;
}
  #map{

  height:340px;

  margin-top:22px;

  border-radius:28px;

  overflow:hidden;

  display:none;

  border:
  1px solid rgba(255,255,255,0.08);

  box-shadow:

  0 0 30px rgba(59,130,246,0.22),

  0 0 60px rgba(34,197,94,0.10);

}
#navigationPanel .card{

  background:

  linear-gradient(
    145deg,
    rgba(15,23,42,0.96),
    rgba(30,41,59,0.92)
  );

  border:

  1px solid rgba(255,255,255,0.06);

  color:white;

  border-radius:28px;

  padding:22px;

  box-shadow:

  0 0 30px rgba(59,130,246,0.16),

  0 0 60px rgba(34,197,94,0.08);

}
  /* CHAT ICONS */

#chatIcons{
  display:flex;
  gap:12px;
  margin-bottom:12px;
}

#chatIcons button{
  width:52px;
  height:52px;
  border-radius:50%;
  border:none;
  font-size:22px;
  cursor:pointer;
  background:rgba(15,23,42,0.9);
  color:white;
  box-shadow:
  0 0 15px rgba(34,197,94,0.25);
}

/* CHAT POPUP */

#chatPopup{
  display:none;
  position:fixed;
  bottom:20px;
  right:20px;
  width:320px;
  height:420px;
  background:rgba(15,23,42,0.96);
  backdrop-filter:blur(15px);
  border-radius:22px;
  overflow:hidden;
  z-index:999;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
  0 0 35px rgba(34,197,94,0.18);
}

#chatHeader{
  padding:15px;
  background:#16a34a;
  color:white;
  font-weight:bold;
}

#chatMessages{
  height:300px;
  overflow-y:auto;
  padding:12px;
  color:white;
}

#chatInputArea{
  display:flex;
  padding:10px;
  gap:8px;
}

#chatInput{
  flex:1;
  border:none;
  border-radius:12px;
  padding:12px;
  outline:none;
}

#sendMsgBtn{
  width:55px;
  border:none;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">
    <span>Pahadi</span>
    <img src="logo.png">
    <span>Gaadi</span>
  </div>
 <div class="sub">Driver</div>

<button id="logoutBtn">
Logout
</button>

</div>
<div id="loginBox" class="container">

<h2>📱 Driver OTP Login</h2>

<input
  type="text"
  id="phoneNumber"
  placeholder="+91XXXXXXXXXX"
  style="
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    border:none;
  "
>

<button id="sendOtpBtn" class="accept">
  Send OTP
</button>

<input
  type="text"
  id="otpCode"
  placeholder="Enter OTP"
  style="
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:none;
  "
>

<button id="verifyOtpBtn" class="start">
  Verify OTP
</button>

<div id="recaptcha-container"></div>

</div>
<div class="container" id="driverPanel" style="display:none;">
 <h2 style="margin-left: 20px;">
🏔️ 🚘 Pahadi Pilot 🚘 🏔️
</h2>
  <div id="rides"></div>
  <div id="map"></div>

<div id="navigationPanel" style="display:none; margin-top:15px;">
<div id="chatIcons">

  <button id="callBtn">📞</button>

  <button id="chatBtn">💬</button>

</div>
  <div class="card">
    <h3>🧭 Navigation Active</h3>

    <p id="navStatus">Driver heading to pickup...</p>

  <button id="startBtn" class="start" onclick="startRide()">
  Start Ride
</button>

<button
  id="navBtn"
  class="accept"
  onclick="openGoogleNav()"
  style="display:none;"
>
  Open Google Navigation
</button>

<button
  id="completeBtn"
  class="end"
  onclick="completeRide()"
  style="display:none;"
>
  Complete Ride
</button>
</div>
</div>
<div id="chatPopup">

  <div id="chatHeader">
    Rider Chat
  </div>

  <div id="chatMessages"></div>

  <div id="chatInputArea">

    <input
      type="text"
      id="chatInput"
      placeholder="Type message..."
    >

    <button id="sendMsgBtn">➤</button>

  </div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  getDoc,
  query,
  where,
  increment,
  setDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
  storageBucket: "pahadigaadi.firebasestorage.app",
  messagingSenderId: "465488936633",
  appId: "1:465488936633:web:7e5f46325366bf0bf66568"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let confirmationResult = null;

let driverId = null;
  window.db = db;
window.addDoc = addDoc;
window.collection = collection;
window.onSnapshot = onSnapshot;
window.doc = doc;
async function sendMessage(rideId, sender, text) {

if (!text.trim()) return;

await addDoc(collection(db, "rides", rideId, "messages"), {

sender: sender,
text: text,
timestamp: serverTimestamp(),
read: false

});

}
const ridesDiv = document.getElementById("rides");

let activeRideId = null;
  document.getElementById("sendMsgBtn").onclick = async () => {

const text =
document.getElementById("chatInput").value;

if (!activeRideId) return;

await sendMessage(activeRideId, "driver", text);

document.getElementById("chatInput").value = "";

};
let driverLat = 0;
let driverLng = 0;
let map;
let directionsService;
let directionsRenderer;
  
function getDistance(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}
function initMap() {

  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 28.6139, lng: 77.2090 },
    zoom: 13,

    styles: [
      {
        elementType: "geometry",
        stylers: [{ color: "#0f172a" }]
      },
      {
        elementType: "labels.text.fill",
        stylers: [{ color: "#94a3b8" }]
      },
      {
        featureType: "road",
        elementType: "geometry",
        stylers: [{ color: "#1e293b" }]
      },
      {
        featureType: "road.highway",
        elementType: "geometry",
        stylers: [{ color: "#22c55e" }]
      }
    ]
  });

  directionsService = new google.maps.DirectionsService();

  directionsRenderer = new google.maps.DirectionsRenderer({
    polylineOptions: {
      strokeColor: "#22c55e",
      strokeOpacity: 0.9,
      strokeWeight: 6
    }
  });

  directionsRenderer.setMap(map);
}
const q = query(
  collection(db, "rides"),
  where("status", "==", "Pending")
);

onSnapshot(q, (snapshot) => {

  ridesDiv.innerHTML = "";

  let rides = [];

  snapshot.forEach((docSnap) => {

    const data = docSnap.data();

    if (!data.pickupLat || !data.pickupLng) return;

    const dist = getDistance(
      driverLat,
      driverLng,
      data.pickupLat,
      data.pickupLng
    );

    rides.push({
      id: docSnap.id,
      ...data,
      distanceFromDriver: dist
    });

  });

  rides.sort((a, b) => a.distanceFromDriver - b.distanceFromDriver);

  rides.slice(0, 3).forEach((data) => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      📍 ${data.pickup || "-"} <br>
      🏁 ${data.drop || "-"} <br>
      🚗 ${data.vehicle || "-"} <br>
      📏 Ride Distance: ${data.distance || 0} km <br>
      📍 Driver se: ${data.distanceFromDriver.toFixed(2)} km <br>
      <b>Status: ${data.status}</b>
    `;

    const btn = document.createElement("button");

    btn.className = "accept";
    btn.innerText = "Accept Ride";

    btn.onclick = async () => {

      await updateDoc(doc(db, "rides", data.id), {
        status: "accepted",
        driverId: driverId
      });

      localStorage.setItem("activeRideId", data.id);
activeRideId = data.id;
      document.getElementById("map").style.display = "block";

document.getElementById("navigationPanel").style.display = "block";

      if(data.rideStarted){

  document.getElementById("startBtn").style.display =
    "none";

  document.getElementById("navBtn").style.display =
    "block";

  document.getElementById("completeBtn").style.display =
    "block";

}else{

  document.getElementById("startBtn").style.display =
    "block";

  document.getElementById("navBtn").style.display =
    "none";

  document.getElementById("completeBtn").style.display =
    "none";

}

initMap();

directionsService.route({
  origin: {
    lat: driverLat,
    lng: driverLng
  },
destination: {
   lat: data.dropLat,
   lng: data.dropLng
},
  travelMode: "DRIVING"

}, (result, status) => {

  if(status === "OK"){

    directionsRenderer.setDirections(result);

  }

});

    };

    card.appendChild(btn);

    ridesDiv.appendChild(card);

  });

});

let lastUpdate = 0;

navigator.geolocation.watchPosition(async (pos) => {

  const now = Date.now();

  if (now - lastUpdate < 3000) return;

  lastUpdate = now;

  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  driverLat = lat;
  driverLng = lng;

  if(!driverId) return;
  const driverRef = doc(db, "drivers", driverId);

  try {

    await updateDoc(driverRef, {
      lat,
      lng,
      lastUpdated: new Date().toISOString()
    });

  } catch (e) {

    await setDoc(driverRef, {
      lat,
      lng,
      totalEarning: 0
    });

  }

}, (err) => {

  console.log("Location error:", err);

}, {
  enableHighAccuracy: true
});
window.startRide = async function () {
 
  if(!activeRideId) return;
 
  try{
 
  await updateDoc(doc(db, "rides", activeRideId), {
  status: "ongoing",
  rideStarted: true
});

const rideSnapshot = await getDoc(doc(db, "rides", activeRideId));

const rideData = rideSnapshot.data();

directionsService.route({

  origin: {
    lat: driverLat,
    lng: driverLng
  },

  destination: {
    lat: rideData.dropLat,
    lng: rideData.dropLng
  },

  travelMode: "DRIVING"

}, (result, status) => {

  if(status === "OK"){

    directionsRenderer.setDirections(result);

  }

});
 
    document.getElementById("navStatus").innerText =
      "Ride Started";
 
    // 🔥 Button text change
    document.querySelector(".start").innerText =
      "Ride Started";

    document.getElementById("startBtn").style.display = "none";

document.getElementById("navBtn").style.display =
  "block";

document.getElementById("completeBtn").style.display =
  "block";
    
    alert("Ride Started 🚗");
    
  }catch(e){
 
    console.log(e);
 
  }
 
};

window.completeRide = async function () {
 
  if(!activeRideId) return;
 
  try{
 
    await updateDoc(doc(db, "rides", activeRideId), {
      status: "completed"
    });
 
    document.getElementById("navStatus").innerText =
      "Ride Completed";
 
    // 🔥 Button text change
    document.querySelector(".end").innerText =
      "Ride Completed";
 
    alert("Ride Completed 🎉");
     location.reload();
 
  }catch(e){
 
    console.log(e);
 
  }
 
};
  window.openGoogleNav = async function () {

  if(!activeRideId) return;

  const rideSnapshot =
    await getDoc(doc(db, "rides", activeRideId));

  const rideData = rideSnapshot.data();

  window.open(
    `https://www.google.com/maps/dir/?api=1&destination=${rideData.dropLat},${rideData.dropLng}&travelmode=driving`,
    "_blank"
  );

};
  window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  'recaptcha-container',
  {
    size: 'invisible'
  }
);

document.getElementById("sendOtpBtn").onclick =
async () => {

  const phone =
    document.getElementById("phoneNumber").value;

  try {

    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        window.recaptchaVerifier
      );

    alert("OTP Sent ✅");

  } catch (e) {

    console.log(e);

    alert("OTP Failed");

  }

};

document.getElementById("verifyOtpBtn").onclick =
async () => {

  const otp =
    document.getElementById("otpCode").value;

  try {

    const result =
      await confirmationResult.confirm(otp);

    const user = result.user;

    driverId = user.uid;

    localStorage.setItem(
      "driverUid",
      user.uid
    );

    document.getElementById("loginBox")
      .style.display = "none";

    document.getElementById("driverPanel")
      .style.display = "block";

    alert("Driver Login Success 🚗");

  } catch (e) {

    console.log(e);

    alert("Invalid OTP");

  }

};

onAuthStateChanged(auth, (user) => {

  if(user){

    driverId = user.uid;

    document.getElementById("loginBox")
      .style.display = "none";

    document.getElementById("driverPanel")
      .style.display = "block";

  }

});
  document.getElementById("chatBtn").onclick = () => {

  const popup = document.getElementById("chatPopup");

  popup.style.display =
    popup.style.display === "block"
    ? "none"
    : "block";
};
  document.getElementById("logoutBtn").onclick =
async () => {

  await signOut(auth);

  localStorage.clear();

  location.reload();

};
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdQvXgtRqcUX-Vo2ngB_xL2V-cxCydmTI&libraries=places"></script>
</body>
</html>
