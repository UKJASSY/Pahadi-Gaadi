<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PahadiGaadi Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
}

/* 🔥 HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
}

header img {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: white;
  padding: 4px;
}

header h2 {
  margin: 0;
  font-weight: 600;
  font-size: 20px;
}

/* 🔥 CONTAINER */
.container {
  background: white;
  color: black;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* 🔥 CARD DESIGN */
.card {
  background: #f8fafc;
  padding: 15px;
  border-radius: 16px;
  margin-bottom: 15px;
  border: 1px solid #e2e8f0;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.02);
}

/* TEXT */
.pickup {
  font-weight: 600;
  margin-bottom: 5px;
}

.drop {
  color: #555;
  font-size: 14px;
}

.vehicle {
  margin-top: 8px;
  font-size: 14px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(45deg, #16a34a, #22c55e);
  color: white;
  border: none;
  border-radius: 12px;
  margin-top: 12px;
  font-size: 15px;
  font-weight: 500;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h2>PahadiGaadi Driver</h2>
</header>

<div class="container">
  <div id="rides">Loading rides...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  onSnapshot, 
  doc, 
  updateDoc,
  query,
  where 
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOnQmWGHbJFl9Yy54tCvwv-wrSfiAvnc",
  authDomain: "pahadigaadi.firebaseapp.com",
  projectId: "pahadigaadi",
  storageBucket: "pahadigaadi.firebasestorage.app",
  messagingSenderId: "465488936633",
  appId: "1:465488936633:web:7e5f46325366bf0bf66568"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ridesDiv = document.getElementById("rides");

/* 🔔 SOUND SYSTEM */
let firstLoad = true;
let soundEnabled = false;
const audio = new Audio("https://www.soundjay.com/buttons/sounds/beep-01a.mp3");

function unlockSound() {
  audio.muted = true;
  audio.play().then(() => {
    audio.pause();
    audio.currentTime = 0;
    audio.muted = false;
    soundEnabled = true;
  }).catch(() => {});
}

document.body.addEventListener("click", unlockSound, { once: true });
document.body.addEventListener("touchstart", unlockSound, { once: true });

const q = query(collection(db, "rides"), where("status", "==", "Pending"));

onSnapshot(q, (snapshot) => {

  if (!snapshot.empty && !firstLoad && soundEnabled) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }
  firstLoad = false;

  ridesDiv.innerHTML = "";

  if (snapshot.empty) {
    ridesDiv.innerHTML = "<p>No new rides 🚫</p>";
    return;
  }

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="pickup">📍 ${data.pickup}</div>
      <div class="drop">🏁 ${data.drop}</div>
      <div class="vehicle">🚗 ${data.vehicle}</div>
    `;

    const btn = document.createElement("button");
    btn.innerText = "Accept Ride";

    btn.onclick = async () => {
      await updateDoc(doc(db, "rides", docSnap.id), {
        status: "Accepted"
      });
      alert("Ride Accepted 🚀");
    };

    card.appendChild(btn);
    ridesDiv.appendChild(card);
  });
});
</script>

</body>
</html>
